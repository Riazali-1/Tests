<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTest Pro - Testing Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col">
        <!-- Header -->
        <header class="bg-indigo-600 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('home')">
                    <div class="bg-white text-indigo-600 p-2 rounded-xl font-bold text-xl shadow">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight">EduTest Pro</h1>
                        <p class="text-xs text-indigo-200">Interactive Assessment Platform</p>
                    </div>
                </div>
                <div id="header-user-info" class="flex items-center space-x-4">
                    <!-- Dynamically populated auth/role info -->
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6" id="main-content">
            <!-- Content will be dynamically rendered here -->
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 max-w-md bg-white border border-slate-200 shadow-xl rounded-2xl p-4 flex items-center space-x-3">
        <div id="toast-icon" class="text-2xl"></div>
        <div>
            <h4 id="toast-title" class="font-bold text-sm text-slate-800"></h4>
            <p id="toast-message" class="text-xs text-slate-600"></p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase handles
        window.firebaseApp = null;
        window.db = null;
        window.auth = null;
        window.currentUser = null;

        // App configuration setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'edutest-pro-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyMockKeyForDevelopmentOnly12345",
            authDomain: "mock-project.firebaseapp.com",
            projectId: "mock-project",
            storageBucket: "mock-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:abcdef"
        };

        // Initialize Firebase
        try {
            window.firebaseApp = initializeApp(firebaseConfig);
            window.db = getFirestore(window.firebaseApp);
            window.auth = getAuth(window.firebaseApp);

            const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            if (token) {
                signInWithCustomToken(window.auth, token).catch(() => signInAnonymously(window.auth));
            } else {
                signInAnonymously(window.auth);
            }

            onAuthStateChanged(window.auth, (user) => {
                if (user) {
                    window.currentUser = user;
                    console.log("Firebase Authenticated:", user.uid);
                    initApp();
                }
            });
        } catch (e) {
            console.error("Firebase init error, running offline fallback mode:", e);
            initApp();
        }
    </script>

    <script>
        // Application State
        let currentRole = localStorage.getItem('edutest_role') || null; // 'teacher' or 'student'
        let studentName = localStorage.getItem('edutest_student_name') || '';
        let studentId = localStorage.getItem('edutest_student_id') || '';
        let activeView = 'home';
        let testsList = [];
        let attemptsList = [];
        let activeTestToTake = null;
        let activeTeacherTest = null; // For editing/creating
        let currentAttemptAnswers = {};

        // Helper: Show custom toast message
        function showToast(title, message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const titleEl = document.getElementById('toast-title');
            const msgEl = document.getElementById('toast-message');

            titleEl.textContent = title;
            msgEl.textContent = message;

            if (type === 'success') {
                icon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i>';
            } else if (type === 'error') {
                icon.innerHTML = '<i class="fa-solid fa-circle-exclamation text-rose-500"></i>';
            } else {
                icon.innerHTML = '<i class="fa-solid fa-circle-info text-blue-500"></i>';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        // Initialize Firestore Listeners
        function initApp() {
            if (window.db && window.currentUser) {
                // Listen to Tests
                const testsColl = collection(window.db, 'artifacts', typeof __app_id !== 'undefined' ? __app_id : 'edutest-pro-default', 'public', 'data', 'tests');
                onSnapshot(testsColl, (snapshot) => {
                    testsList = [];
                    snapshot.forEach(docSnap => {
                        testsList.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    renderCurrentView();
                }, (err) => {
                    console.error("Error listening to tests:", err);
                });

                // Listen to Attempts
                const attemptsColl = collection(window.db, 'artifacts', typeof __app_id !== 'undefined' ? __app_id : 'edutest-pro-default', 'public', 'data', 'attempts');
                onSnapshot(attemptsColl, (snapshot) => {
                    attemptsList = [];
                    snapshot.forEach(docSnap => {
                        attemptsList.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    renderCurrentView();
                }, (err) => {
                    console.error("Error listening to attempts:", err);
                });
            } else {
                // Fallback mock data if offline
                testsList = [
                    {
                        id: 'test_sample_1',
                        title: 'General Science & Physics Quiz',
                        description: 'Test your foundational knowledge in physics and basic science.',
                        teacherName: 'Prof. Anderson',
                        createdAt: new Date().toISOString(),
                        questions: [
                            {
                                text: 'What is the SI unit of force?',
                                options: ['Joule', 'Newton', 'Watt', 'Pascal'],
                                correctAnswer: 1
                            },
                            {
                                text: 'Which planet is known as the Red Planet?',
                                options: ['Venus', 'Jupiter', 'Mars', 'Saturn'],
                                correctAnswer: 2
                            }
                        ]
                    }
                ];
                attemptsList = [];
                renderCurrentView();
            }
        }

        // Router & View Switcher
        function switchView(viewName, param = null) {
            activeView = viewName;
            if (viewName === 'takeTest') activeTestToTake = param;
            if (viewName === 'teacherEdit') activeTeacherTest = param;
            renderCurrentView();
            window.scrollTo(0, 0);
        }

        function renderCurrentView() {
            renderHeaderUserInfo();
            const main = document.getElementById('main-content');

            if (!currentRole) {
                main.innerHTML = renderRoleSelectionHTML();
                return;
            }

            if (currentRole === 'teacher') {
                if (activeView === 'teacherEdit') {
                    main.innerHTML = renderTeacherEditorHTML(activeTeacherTest);
                } else if (activeView === 'teacherResults') {
                    main.innerHTML = renderTeacherResultsHTML();
                } else {
                    main.innerHTML = renderTeacherDashboardHTML();
                }
            } else if (currentRole === 'student') {
                if (!studentName || !studentId) {
                    main.innerHTML = renderStudentLoginHTML();
                    return;
                }
                if (activeView === 'takeTest' && activeTestToTake) {
                    main.innerHTML = renderTakeTestHTML(activeTestToTake);
                } else if (activeView === 'studentHistory') {
                    main.innerHTML = renderStudentHistoryHTML();
                } else {
                    main.innerHTML = renderStudentDashboardHTML();
                }
            }
        }

        function renderHeaderUserInfo() {
            const container = document.getElementById('header-user-info');
            if (!currentRole) {
                container.innerHTML = `<span class="text-sm bg-indigo-700 px-3 py-1 rounded-full text-indigo-100">Select Mode</span>`;
                return;
            }

            if (currentRole === 'teacher') {
                container.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="bg-indigo-800 text-indigo-100 text-xs px-3 py-1.5 rounded-full font-medium border border-indigo-500"><i class="fa-solid fa-chalkboard-user mr-1"></i> Teacher Mode</span>
                        <button onclick="logoutRole()" class="text-xs bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-right-from-bracket mr-1"></i> Switch Role</button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex items-center space-x-3 text-right">
                        <div>
                            <p class="text-sm font-semibold">${escapeHTML(studentName)}</p>
                            <p class="text-xs text-indigo-200">ID: ${escapeHTML(studentId)}</p>
                        </div>
                        <button onclick="logoutRole()" class="text-xs bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
                    </div>
                `;
            }
        }

        function escapeHTML(str) {
            return str ? str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            ) : '';
        }

        function setRole(role) {
            currentRole = role;
            localStorage.setItem('edutest_role', role);
            renderCurrentView();
            showToast('Mode Selected', `Switched to ${role.toUpperCase()} mode.`, 'info');
        }

        function logoutRole() {
            currentRole = null;
            studentName = '';
            studentId = '';
            localStorage.removeItem('edutest_role');
            localStorage.removeItem('edutest_student_name');
            localStorage.removeItem('edutest_student_id');
            switchView('home');
            showToast('Logged Out', 'Returned to role selection.', 'info');
        }

        function handleStudentLogin(event) {
            event.preventDefault();
            const name = document.getElementById('login-name').value.trim();
            const id = document.getElementById('login-id').value.trim();
            if (!name || !id) {
                showToast('Error', 'Please enter both your name and student ID.', 'error');
                return;
            }
            studentName = name;
            studentId = id;
            localStorage.setItem('edutest_student_name', name);
            localStorage.setItem('edutest_student_id', id);
            renderCurrentView();
            showToast('Welcome!', `Logged in successfully as ${name}.`, 'success');
        }
    </script>

    <script>
        function renderRoleSelectionHTML() {
            return `
                <div class="flex-1 flex items-center justify-center py-12">
                    <div class="max-w-4xl w-full grid md:grid-cols-2 gap-8 px-4">
                        <!-- Teacher Mode Card -->
                        <div onclick="setRole('teacher')" class="bg-white border-2 border-slate-200 hover:border-indigo-600 rounded-3xl p-8 shadow-sm hover:shadow-xl transition cursor-pointer group flex flex-col justify-between">
                            <div>
                                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-3xl mb-6 group-hover:bg-indigo-600 group-hover:text-white transition">
                                    <i class="fa-solid fa-chalkboard-user"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-slate-900 mb-3">Teacher Portal</h2>
                                <p class="text-slate-600 text-sm leading-relaxed mb-6">Create and manage multi-choice tests, review student submission analytics, view live leaderboards, and export score reports to Excel/CSV.</p>
                            </div>
                            <div class="flex items-center text-indigo-600 font-semibold group-hover:translate-x-2 transition">
                                Enter Teacher Mode <i class="fa-solid fa-arrow-right ml-2"></i>
                            </div>
                        </div>

                        <!-- Student Mode Card -->
                        <div onclick="setRole('student')" class="bg-white border-2 border-slate-200 hover:border-emerald-500 rounded-3xl p-8 shadow-sm hover:shadow-xl transition cursor-pointer group flex flex-col justify-between">
                            <div>
                                <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-3xl mb-6 group-hover:bg-emerald-500 group-hover:text-white transition">
                                    <i class="fa-solid fa-user-graduate"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-slate-900 mb-3">Student Portal</h2>
                                <p class="text-slate-600 text-sm leading-relaxed mb-6">Enroll with your student ID, view active tests, take assessments with instant green/red feedback, track your past scores, and check live leaderboards.</p>
                            </div>
                            <div class="flex items-center text-emerald-600 font-semibold group-hover:translate-x-2 transition">
                                Enter Student Mode <i class="fa-solid fa-arrow-right ml-2"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudentLoginHTML() {
            return `
                <div class="flex-1 flex items-center justify-center py-12">
                    <div class="max-w-md w-full bg-white border border-slate-200 rounded-3xl p-8 shadow-xl">
                        <div class="text-center mb-6">
                            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4">
                                <i class="fa-solid fa-id-card"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-900">Student Enrollment</h2>
                            <p class="text-sm text-slate-500 mt-1">Enter your details to access tests and view leaderboards</p>
                        </div>
                        <form onsubmit="handleStudentLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Full Name</label>
                                <input type="text" id="login-name" required placeholder="e.g. Sarah Jenkins" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Student ID / Roll No</label>
                                <input type="text" id="login-id" required placeholder="e.g. STU-84920" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                            </div>
                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-lg transition text-sm">
                                Continue to Dashboard <i class="fa-solid fa-arrow-right ml-1"></i>
                            </button>
                        </form>
                        <div class="mt-6 text-center">
                            <button onclick="logoutRole()" class="text-xs text-slate-500 hover:text-slate-800 underline"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Role Selection</button>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>

    <script>
        function renderTeacherDashboardHTML() {
            return `
                <div class="space-y-6">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">Teacher Dashboard</h2>
                            <p class="text-sm text-slate-500">Manage your tests, track student performance, and review submissions.</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="switchView('teacherResults')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-semibold text-sm transition">
                                <i class="fa-solid fa-chart-line mr-2"></i> All Student Results & Export
                            </button>
                            <button onclick="openNewTestEditor()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm shadow transition">
                                <i class="fa-solid fa-plus mr-2"></i> Create New Test
                            </button>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
                                <i class="fa-solid fa-file-lines"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-500 uppercase font-semibold">Total Tests Created</p>
                                <h3 class="text-2xl font-bold text-slate-900">${testsList.length}</h3>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                                <i class="fa-solid fa-users"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-500 uppercase font-semibold">Total Submissions</p>
                                <h3 class="text-2xl font-bold text-slate-900">${attemptsList.length}</h3>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl">
                                <i class="fa-solid fa-award"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-500 uppercase font-semibold">Average Score</p>
                                <h3 class="text-2xl font-bold text-slate-900">${calculateOverallAverageScore()}%</h3>
                            </div>
                        </div>
                    </div>

                    <!-- Tests List -->
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-lg text-slate-900">Your Uploaded Tests</h3>
                            <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-medium">${testsList.length} Active Tests</span>
                        </div>
                        <div class="divide-y divide-slate-100">
                            ${testsList.length === 0 ? `
                                <div class="p-12 text-center text-slate-400">
                                    <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
                                    <p class="text-sm">No tests created yet. Click "Create New Test" to get started.</p>
                                </div>
                            ` : testsList.map(test => `
                                <div class="p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:bg-slate-50 transition">
                                    <div>
                                        <h4 class="font-bold text-slate-900 text-base">${escapeHTML(test.title)}</h4>
                                        <p class="text-xs text-slate-500 mt-0.5">${escapeHTML(test.description || 'No description provided')}</p>
                                        <div class="flex items-center space-x-4 mt-2 text-xs text-slate-500">
                                            <span><i class="fa-solid fa-circle-question mr-1 text-indigo-500"></i> ${test.questions ? test.questions.length : 0} Questions</span>
                                            <span><i class="fa-solid fa-calendar mr-1 text-slate-400"></i> ${new Date(test.createdAt || Date.now()).toLocaleDateString()}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
                                        <button onclick="editTest('${test.id}')" class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl text-xs font-semibold transition">
                                            <i class="fa-solid fa-pen-to-square mr-1"></i> Edit
                                        </button>
                                        <button onclick="deleteTestPrompt('${test.id}')" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-xl text-xs font-semibold transition">
                                            <i class="fa-solid fa-trash mr-1"></i> Delete
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function calculateOverallAverageScore() {
            if (attemptsList.length === 0) return 0;
            const total = attemptsList.reduce((acc, curr) => acc + (curr.percentage || 0), 0);
            return Math.round(total / attemptsList.length);
        }

        function openNewTestEditor() {
            activeTeacherTest = {
                id: 'test_' + Date.now(),
                title: '',
                description: '',
                questions: [
                    {
                        text: '',
                        options: ['', '', '', ''],
                        correctAnswer: 0
                    }
                ]
            };
            switchView('teacherEdit', activeTeacherTest);
        }

        function editTest(testId) {
            const test = testsList.find(t => t.id === testId);
            if (test) {
                // Deep clone
                activeTeacherTest = JSON.parse(JSON.stringify(test));
                switchView('teacherEdit', activeTeacherTest);
            }
        }

        function renderTeacherEditorHTML(test) {
            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="flex justify-between items-center bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">${test.id.startsWith('test_') && !testsList.some(t => t.id === test.id) ? 'Create New Test' : 'Edit Test'}</h2>
                            <p class="text-sm text-slate-500">Configure questions, options, and correct answers.</p>
                        </div>
                        <button onclick="switchView('home')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-semibold transition">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Cancel
                        </button>
                    </div>

                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Test Title</label>
                            <input type="text" id="edit-test-title" value="${escapeHTML(test.title)}" placeholder="e.g. Advanced Chemistry Final Exam" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-semibold">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Description / Instructions</label>
                            <textarea id="edit-test-desc" rows="2" placeholder="Brief instructions for students taking this test..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">${escapeHTML(test.description || '')}</textarea>
                        </div>
                    </div>

                    <!-- Questions Section -->
                    <div id="questions-container" class="space-y-6">
                        ${test.questions.map((q, qIndex) => `
                            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm question-card space-y-4" data-qindex="${qIndex}">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold uppercase bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full">Question ${qIndex + 1}</span>
                                    ${test.questions.length > 1 ? `
                                        <button onclick="removeQuestion(${qIndex})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold"><i class="fa-solid fa-trash mr-1"></i> Remove</button>
                                    ` : ''}
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Question Text</label>
                                    <input type="text" class="q-text w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" value="${escapeHTML(q.text)}" placeholder="Enter question...">
                                </div>
                                <div class="space-y-3">
                                    <label class="block text-xs font-semibold text-slate-700 uppercase">Options (Select the correct answer radio)</label>
                                    ${q.options.map((opt, oIndex) => `
                                        <div class="flex items-center space-x-3">
                                            <input type="radio" name="correct_${qIndex}" value="${oIndex}" ${q.correctAnswer === oIndex ? 'checked' : ''} class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                                            <input type="text" class="q-option flex-1 px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" value="${escapeHTML(opt)}" placeholder="Option ${oIndex + 1}">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex justify-between items-center pt-2">
                        <button onclick="addQuestion()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-5 py-3 rounded-xl text-sm transition">
                            <i class="fa-solid fa-plus mr-1"></i> Add Another Question
                        </button>
                        <button onclick="saveTest()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-xl shadow-lg text-sm transition">
                            <i class="fa-solid fa-floppy-disk mr-2"></i> Save & Publish Test
                        </button>
                    </div>
                </div>
            `;
        }

        function addQuestion() {
            collectEditorData();
            activeTeacherTest.questions.push({
                text: '',
                options: ['', '', '', ''],
                correctAnswer: 0
            });
            renderCurrentView();
        }

        function removeQuestion(index) {
            collectEditorData();
            activeTeacherTest.questions.splice(index, 1);
            renderCurrentView();
        }

        function collectEditorData() {
            if (!activeTeacherTest) return;
            activeTeacherTest.title = document.getElementById('edit-test-title').value.trim();
            activeTeacherTest.description = document.getElementById('edit-test-desc').value.trim();

            const cards = document.querySelectorAll('.question-card');
            cards.forEach((card, qIndex) => {
                const textInput = card.querySelector('.q-text');
                const optInputs = card.querySelectorAll('.q-option');
                const radios = card.querySelectorAll(`input[name="correct_${qIndex}"]`);

                activeTeacherTest.questions[qIndex].text = textInput.value.trim();
                activeTeacherTest.questions[qIndex].options = Array.from(optInputs).map(inp => inp.value.trim());

                radios.forEach((radio, rIndex) => {
                    if (radio.checked) {
                        activeTeacherTest.questions[qIndex].correctAnswer = rIndex;
                    }
                });
            });
        }

        async function saveTest() {
            collectEditorData();
            if (!activeTeacherTest.title) {
                showToast('Error', 'Please provide a title for the test.', 'error');
                return;
            }
            for (let i = 0; i < activeTeacherTest.questions.length; i++) {
                if (!activeTeacherTest.questions[i].text) {
                    showToast('Error', `Question ${i + 1} text is empty.`, 'error');
                    return;
                }
            }

            activeTeacherTest.createdAt = activeTeacherTest.createdAt || new Date().toISOString();
            activeTeacherTest.teacherName = 'Teacher Admin';

            if (window.db && window.currentUser) {
                try {
                    const testRef = doc(window.db, 'artifacts', typeof __app_id !== 'undefined' ? __app_id : 'edutest-pro-default', 'public', 'data', 'tests', activeTeacherTest.id);
                    await setDoc(testRef, activeTeacherTest);
                    showToast('Success', 'Test saved and published successfully!', 'success');
                    switchView('home');
                } catch (e) {
                    console.error("Firestore save error:", e);
                    showToast('Error', 'Failed to save test to cloud storage.', 'error');
                }
            } else {
                // Offline fallback
                const index = testsList.findIndex(t => t.id === activeTeacherTest.id);
                if (index >= 0) testsList[index] = activeTeacherTest;
                else testsList.push(activeTeacherTest);
                showToast('Success', 'Test saved locally!', 'success');
                switchView('home');
            }
        }

        async function deleteTestPrompt(testId) {
            if (confirm('Are you sure you want to delete this test? All student attempts associated with it will remain in history.')) {
                if (window.db && window.currentUser) {
                    try {
                        const testRef = doc(window.db, 'artifacts', typeof __app_id !== 'undefined' ? __app_id : 'edutest-pro-default', 'public', 'data', 'tests', testId);
                        await deleteDoc(testRef);
                        showToast('Deleted', 'Test deleted successfully.', 'info');
                    } catch (e) {
                        showToast('Error', 'Failed to delete test.', 'error');
                    }
                } else {
                    testsList = testsList.filter(t => t.id !== testId);
                    renderCurrentView();
                    showToast('Deleted', 'Test deleted.', 'info');
                }
            }
        }
    </script>

    <script>
        function renderStudentDashboardHTML() {
            // Find student's previous attempts
            const myAttempts = attemptsList.filter(a => a.studentId === studentId);

            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-8 rounded-3xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <span class="bg-emerald-500/40 text-emerald-100 text-xs px-3 py-1 rounded-full font-semibold">Student Portal</span>
                            <h2 class="text-3xl font-bold mt-2">Welcome back, ${escapeHTML(studentName)}!</h2>
                            <p class="text-emerald-100 text-sm mt-1">Select an active test below. Enjoy instant feedback on every question with no strict timers.</p>
                        </div>
                        <div class="bg-white/10 backdrop-blur-md px-6 py-4 rounded-2xl border border-white/20 text-center">
                            <p class="text-xs text-emerald-200 uppercase font-bold">Tests Completed</p>
                            <h3 class="text-3xl font-extrabold">${myAttempts.length}</h3>
                        </div>
                    </div>

                    <!-- Available Tests -->
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-lg text-slate-900"><i class="fa-solid fa-book-open text-emerald-600 mr-2"></i> Available Enrolled Tests</h3>
                            <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-medium">${testsList.length} Tests Ready</span>
                        </div>
                        <div class="grid md:grid-cols-2 gap-6 p-6">
                            ${testsList.length === 0 ? `
                                <div class="col-span-2 py-12 text-center text-slate-400">
                                    <i class="fa-solid fa-clipboard-question text-4xl mb-3"></i>
                                    <p class="text-sm">No tests uploaded by teachers yet. Please check back soon!</p>
                                </div>
                            ` : testsList.map(test => {
                                const taken = myAttempts.find(a => a.testId === test.id);
                                return `
                                    <div class="border border-slate-200 rounded-2xl p-6 hover:shadow-md transition flex flex-col justify-between bg-white">
                                        <div>
                                            <div class="flex justify-between items-start mb-3">
                                                <h4 class="font-bold text-slate-900 text-lg">${escapeHTML(test.title)}</h4>
                                                ${taken ? `<span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-full"><i class="fa-solid fa-check mr-1"></i> Completed (${taken.score}/${taken.total})</span>` : `<span class="bg-amber-50 text-amber-700 text-xs font-semibold px-2.5 py-1 rounded-full">Pending</span>`}
                                            </div>
                                            <p class="text-xs text-slate-500 mb-4 line-clamp-2">${escapeHTML(test.description || 'No description provided')}</p>
                                            <div class="flex items-center space-x-4 text-xs text-slate-400 mb-6">
                                                <span><i class="fa-solid fa-circle-question mr-1 text-emerald-500"></i> ${test.questions ? test.questions.length : 0} Questions</span>
                                                <span><i class="fa-solid fa-chalkboard-user mr-1"></i> ${escapeHTML(test.teacherName || 'Teacher')}</span>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <button onclick="switchView('takeTest', '${test.id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-sm shadow transition text-center">
                                                ${taken ? 'Retake / Review Test' : 'Start Test Now'}
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- My Recent History & Leaderboards -->
                    <div class="grid md:grid-cols-2 gap-6">
                        <!-- Student History -->
                        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
                            <h3 class="font-bold text-lg text-slate-900 mb-4"><i class="fa-solid fa-clock-rotate-left text-indigo-600 mr-2"></i> Your Recent History</h3>
                            <div class="space-y-3">
                                ${myAttempts.length === 0 ? `
                                    <p class="text-xs text-slate-400 py-6 text-center">You haven't completed any tests yet.</p>
                                ` : myAttempts.map(att => `
                                    <div class="p-4 bg-slate-50 rounded-2xl flex justify-between items-center">
                                        <div>
                                            <h5 class="font-bold text-slate-800 text-sm">${escapeHTML(att.testTitle)}</h5>
                                            <p class="text-xs text-slate-500">${new Date(att.timestamp).toLocaleDateString()}</p>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-sm font-bold ${att.percentage >= 50 ? 'text-emerald-600' : 'text-rose-600'}">${att.score} / ${att.total} (${att.percentage}%)</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Live Leaderboard Preview -->
                        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
                            <h3 class="font-bold text-lg text-slate-900 mb-4"><i class="fa-solid fa-trophy text-amber-500 mr-2"></i> Top Global Leaderboard</h3>
                            <div class="space-y-3">
                                ${attemptsList.length === 0 ? `
                                    <p class="text-xs text-slate-400 py-6 text-center">No scores recorded yet.</p>
                                ` : renderLeaderboardList()}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLeaderboardList() {
            // Sort attempts by percentage descending
            const sorted = [...attemptsList].sort((a, b) => b.percentage - a.percentage).slice(0, 5);
            return sorted.map((att, idx) => `
                <div class="p-3 bg-slate-50 rounded-2xl flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${idx === 0 ? 'bg-amber-100 text-amber-700' : idx === 1 ? 'bg-slate-200 text-slate-700' : idx === 2 ? 'bg-orange-100 text-orange-700' : 'bg-slate-100 text-slate-500'}">
                            ${idx + 1}
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-800">${escapeHTML(att.studentName)}</p>
                            <p class="text-xs text-slate-500">${escapeHTML(att.testTitle)}</p>
                        </div>
                    </div>
                    <span class="text-sm font-bold text-indigo-600">${att.percentage}%</span>
                </div>
            `).join('');
        }

        function renderTakeTestHTML(testId) {
            const test = testsList.find(t => t.id === testId);
            if (!test) {
                return `<div>Test not found. <button onclick="switchView('home')">Go Back</button></div>`;
            }

            return `
                <div class="max-w-3xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex justify-between items-center sticky top-4 z-10 backdrop-blur-md bg-white/90">
                        <div>
                            <span class="text-xs font-bold text-emerald-600 uppercase bg-emerald-50 px-3 py-1 rounded-full">Active Assessment</span>
                            <h2 class="text-xl font-bold text-slate-900 mt-1">${escapeHTML(test.title)}</h2>
                        </div>
                        <button onclick="switchView('home')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-semibold transition">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Exit Test
                        </button>
                    </div>

                    <div class="space-y-6" id="test-questions-form">
                        ${test.questions.map((q, qIndex) => `
                            <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-4 test-q-item" data-qindex="${qIndex}" data-correct="${q.correctAnswer}">
                                <div class="flex items-start space-x-3">
                                    <span class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-sm shrink-0">${qIndex + 1}</span>
                                    <h3 class="font-bold text-slate-900 text-base pt-1">${escapeHTML(q.text)}</h3>
                                </div>
                                <div class="space-y-2.5 pl-11">
                                    ${q.options.map((opt, oIndex) => `
                                        <button type="button" onclick="selectOption(${qIndex}, ${oIndex})" class="option-btn-${qIndex} w-full text-left p-4 rounded-2xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/30 transition text-sm font-medium flex items-center justify-between" data-oindex="${oIndex}">
                                            <span>${escapeHTML(opt)}</span>
                                            <span class="option-indicator-${qIndex}-${oIndex} text-xs font-bold"></span>
                                        </button>
                                    `).join('')}
                                </div>
                                <div id="feedback-${qIndex}" class="pl-11 text-xs font-semibold hidden"></div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm text-center">
                        <button onclick="submitTestAnswers('${test.id}')" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-10 py-3.5 rounded-2xl shadow-xl text-base transition">
                            <i class="fa-solid fa-paper-plane mr-2"></i> Submit Final Answers
                        </button>
                    </div>
                </div>
            `;
        }

        function selectOption(qIndex, oIndex) {
            const qItem = document.querySelector(`.test-q-item[data-qindex="${qIndex}"]`);
            const correctAnswer = parseInt(qItem.getAttribute('data-correct'));
            const buttons = qItem.querySelectorAll(`[class*="option-btn-${qIndex}"]`);

            // Save user choice
            currentAttemptAnswers[qIndex] = oIndex;

            // Highlight instantly with Green/Red feedback
            buttons.forEach((btn, idx) => {
                btn.classList.remove('border-emerald-500', 'bg-emerald-50', 'border-rose-500', 'bg-rose-50');
                const indicator = btn.querySelector(`[class*="option-indicator-${qIndex}"]`);
                indicator.innerHTML = '';

                if (idx === oIndex) {
                    if (idx === correctAnswer) {
                        btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                        indicator.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-base"></i> Correct!';
                    } else {
                        btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                        indicator.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600 text-base"></i> Incorrect';
                    }
                } else if (idx === correctAnswer) {
                    // Show correct answer if student was wrong
                    btn.classList.add('border-emerald-300', 'bg-emerald-50/50');
                    indicator.innerHTML = '<span class="text-emerald-600">Correct Answer</span>';
                }
            });

            const feedbackEl = document.getElementById(`feedback-${qIndex}`);
            feedbackEl.classList.remove('hidden');
            if (oIndex === correctAnswer) {
                feedbackEl.innerHTML = `<span class="text-emerald-600"><i class="fa-solid fa-check mr-1"></i> Great job! That is correct.</span>`;
            } else {
                feedbackEl.innerHTML = `<span class="text-rose-600"><i class="fa-solid fa-xmark mr-1"></i> Incorrect. The correct answer was highlighted in green.</span>`;
            }
        }

        async function submitTestAnswers(testId) {
            const test = testsList.find(t => t.id === testId);
            if (!test) return;

            let score = 0;
            const total = test.questions.length;

            test.questions.forEach((q, idx) => {
                if (currentAttemptAnswers[idx] === q.correctAnswer) {
                    score++;
                }
            });

            const percentage = Math.round((score / total) * 100);
            const attemptData = {
                id: 'att_' + Date.now() + '_' + studentId,
                testId: test.id,
                testTitle: test.title,
                studentId: studentId,
                studentName: studentName,
                score: score,
                total: total,
                percentage: percentage,
                timestamp: new Date().toISOString()
            };

            if (window.db && window.currentUser) {
                try {
                    const attRef = doc(window.db, 'artifacts', typeof __app_id !== 'undefined' ? __app_id : 'edutest-pro-default', 'public', 'data', 'attempts', attemptData.id);
                    await setDoc(attRef, attemptData);
                    showToast('Submitted!', `Test submitted successfully. Score: ${score}/${total} (${percentage}%)`, 'success');
                    currentAttemptAnswers = {};
                    switchView('home');
                } catch (e) {
                    console.error("Error submitting attempt:", e);
                    showToast('Error', 'Failed to submit score.', 'error');
                }
            } else {
                attemptsList.push(attemptData);
                currentAttemptAnswers = {};
                showToast('Submitted!', `Test submitted successfully. Score: ${score}/${total} (${percentage}%)`, 'success');
                switchView('home');
            }
        }
    </script>

    <script>
        function renderTeacherResultsHTML() {
            return `
                <div class="space-y-6">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">Student Results & Analytics</h2>
                            <p class="text-sm text-slate-500">View all student attempts across all tests and export reports.</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-semibold text-sm shadow transition">
                                <i class="fa-solid fa-file-excel mr-2"></i> Export Results (CSV)
                            </button>
                            <button onclick="switchView('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-semibold text-sm transition">
                                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Dashboard
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden p-6">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                                        <th class="py-3 px-4">Student Name</th>
                                        <th class="py-3 px-4">Student ID</th>
                                        <th class="py-3 px-4">Test Title</th>
                                        <th class="py-3 px-4">Score</th>
                                        <th class="py-3 px-4">Percentage</th>
                                        <th class="py-3 px-4">Date & Time</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${attemptsList.length === 0 ? `
                                        <tr>
                                            <td colspan="6" class="py-12 text-center text-slate-400">No student attempts recorded yet.</td>
                                        </tr>
                                    ` : attemptsList.map(att => `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="py-4 px-4 font-bold text-slate-900">${escapeHTML(att.studentName)}</td>
                                            <td class="py-4 px-4 text-slate-600 font-mono text-xs">${escapeHTML(att.studentId)}</td>
                                            <td class="py-4 px-4 text-slate-800 font-medium">${escapeHTML(att.testTitle)}</td>
                                            <td class="py-4 px-4 font-bold text-slate-900">${att.score} / ${att.total}</td>
                                            <td class="py-4 px-4">
                                                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${att.percentage >= 50 ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">
                                                    ${att.percentage}%
                                                </span>
                                            </td>
                                            <td class="py-4 px-4 text-slate-500 text-xs">${new Date(att.timestamp).toLocaleString()}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportToCSV() {
            if (attemptsList.length === 0) {
                showToast('No Data', 'There are no student attempts to export.', 'error');
                return;
            }

            let csvContent = "Student Name,Student ID,Test Title,Score,Total,Percentage,Timestamp\n";
            attemptsList.forEach(att => {
                const row = [
                    `"${(att.studentName || '').replace(/"/g, '""')}"`,
                    `"${(att.studentId || '').replace(/"/g, '""')}"`,
                    `"${(att.testTitle || '').replace(/"/g, '""')}"`,
                    att.score,
                    att.total,
                    `${att.percentage}%`,
                    `"${new Date(att.timestamp).toLocaleString()}"`
                ];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `edutest_results_${Date.now()}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('Exported', 'Student results successfully exported to CSV!', 'success');
        }

        // On window load
        window.onload = function() {
            renderCurrentView();
        }
    </script>
</body>
</html>
